<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <style>
      /* Un poco de estilo rápido para que no se vea todo amontonado */
      body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
      .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; }
      .input-group { margin-bottom: 15px; }
      label { display: block; font-weight: bold; margin-bottom: 5px; }
      input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
      button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
      button:hover { background: #0056b3; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="form-container">
        <h2>Nuevo Jugador</h2>
        
        <div class="input-group">
          <label>Nickname:</label>
          <input type="text" id="nicknameInput" placeholder="Ej: PlayerOne">
        </div>

        <div class="input-group">
          <label>Nivel:</label>
          <input type="number" id="levelInput" value="1">
        </div>

        <hr>
        <h3>Trofeo</h3>

        <div class="input-group">
          <label>Juego:</label>
          <select id="gameInput">
            <option value="League of Legends">League of Legends</option>
            <option value="Valorant">Valorant</option>
          </select>
        </div>

        <div class="input-group">
          <label>Torneo:</label>
          <input type="text" id="tournamentInput" placeholder="Ej: Worlds 2024">
        </div>

        <button id="submitBtn">Registrar Jugador</button>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
